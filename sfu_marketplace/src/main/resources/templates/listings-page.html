
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>SFU Marketplace</title>
</head>
<body>

    <h1>SFU Marketplace</h1>

    <!-- Navigation buttons -->
    <div class="listing_page_button_container">

        <!-- Buttons shown when the user is logged out -->
        <div th:if="${session.session_account == null}">

            <a th:href="@{/login}">
                <button type="button" class="small-button">
                    Login
                </button>
            </a>

            <a th:href="@{/register}">
                <button type="button" class="small-button">
                    Register
                </button>
            </a>

        </div>

        <!-- Buttons shown when the user is logged in -->
        <div th:if="${session.session_account != null}">

            <!-- Messages inbox with unread notification count -->
            <a th:href="@{/messages}">
                <button type="button" class="small-button">
                    Messages
                    <span class="unread-badge"
                          th:if="${unreadCount > 0}"
                          th:text="${unreadCount}">
                    </span>
                </button>
            </a>

            <!-- Log out button -->
            <form th:action="@{/logout}"
                  method="post"
                  style="display: inline;">

                <button type="submit" class="small-button">
                    Logout
                </button>

            </form>

        </div>

        <!-- Create Listing button is always visible -->
        <a th:href="@{/listings/new}">
            <button type="button" class="small-button">
                + Create New Listing
            </button>
        </a>

    </div>

    <!-- Display available listings -->
    <section th:if="${!#lists.isEmpty(listings)}">

        <h2 class="results-count"
            th:text="'Listings (' + ${listings.size()} + ')'">
            Listings (0)
        </h2>

        <div class="listing-grid">

            <div class="listing-card"
                 th:each="item : ${listings}">

                <!-- Display the first uploaded photo -->
                <div class="listing-card-image"
                     th:if="${!#lists.isEmpty(item.photos)}">

                    <img th:src="@{${item.photos[0].imagePath}}"
                         th:alt="${item.title}"
                         class="listing-image">

                </div>

                <!-- Display a placeholder if no photo was uploaded -->
                <div class="listing-card-image no-image"
                     th:if="${#lists.isEmpty(item.photos)}">

                    <p>No photo available</p>

                </div>

                <div class="card-content">

                    <h2 class="listing-title"
                        th:text="${item.title}">
                        Listing title
                    </h2>

                    <h3 class="price"
                        th:text="|$${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}|">
                        $25.00
                    </h3>

                    <p class="card-category"
                       th:text="${item.category}">
                        Category
                    </p>

                    <a class="view-link"
                       th:href="@{/listings/{id}(id=${item.listingId})}">
                        View Details →
                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- Display message when there are no listings -->
    <section th:if="${#lists.isEmpty(listings)}"
             class="empty-state">

        <h2>No listings yet</h2>

        <p>
            There are no items listed right now.
            Check back later for new finds!
        </p>

    </section>

</body>
</html>
