<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Create a Listing</h1>
    <p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color: green; text-align: center;">
    </p>

    <form th:action="@{/listings}" th:object="${listing}" method="post">

        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" required>
        <span th:if="${#fields.hasErrors('title')}"
              th:errors="*{title}"></span>
        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" th:field="*{description}" required></textarea>
        <span th:if="${#fields.hasErrors('description')}"
              th:errors="*{description}"></span>
        <br><br>

        <label for="price">Price ($):</label>
        <input type="number" id="price" th:field="*{price}" min="0" step="0.01" required>
        <span th:if="${#fields.hasErrors('price')}"
              th:errors="*{price}"></span>
        <br><br>

        <label for="condition">Condition:</label>
        <select id="condition" th:field="*{condition}" required>
            <option value="">Select condition</option>
            <option value="NEW">New</option>
            <option value="USED">Used</option>
        </select>
        <span th:if="${#fields.hasErrors('condition')}"
              th:errors="*{condition}"></span>
        <br><br>

        <label for="category">Category:</label>
        <input type="text" id="category" th:field="*{category}" required>
        <span th:if="${#fields.hasErrors('category')}"
              th:errors="*{category}"></span>
        <br><br>

        <button type="submit">Create Listing</button>

    </form>

        <div class="link">
            <p>
                  <a href="/listings">Return to listings page</a>
            </p>
      </div>

</body>
</html>
