
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Create a Listing</h1>

    <!-- Displays photo upload errors -->
    <p th:if="${photoError}"
       th:text="${photoError}"
       style="color: red; text-align: center;">
    </p>

    <form th:action="@{/listings}"
          th:object="${listing}"
          method="post"
          enctype="multipart/form-data">

        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" required>
        <span th:if="${#fields.hasErrors('title')}"
              th:errors="*{title}"></span>
        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" th:field="*{description}" required></textarea>
        <span th:if="${#fields.hasErrors('description')}"
              th:errors="*{description}"></span>
        <br><br>

        <label for="price">Price ($):</label>
        <input type="number" id="price" th:field="*{price}"
               min="0" step="0.01" required>
        <span th:if="${#fields.hasErrors('price')}"
              th:errors="*{price}"></span>
        <br><br>

        <label for="condition">Condition:</label>
        <select id="condition" th:field="*{condition}" required>
            <option value="">Select condition</option>
            <option value="NEW">New</option>
            <option value="USED">Used</option>
        </select>
        <span th:if="${#fields.hasErrors('condition')}"
              th:errors="*{condition}"></span>
        <br><br>

       <label for="category">Category:</label>

        <select id="category" th:field="*{category}" required>
            <option value="">Select a category</option>

            <option th:each="cat : ${categories}"
                    th:value="${cat.name()}"
                    th:text="${cat.displayName}">
            </option>
        </select>

        <span th:if="${#fields.hasErrors('category')}"
            th:errors="*{category}"></span>
        <br><br>

        <!-- Allows the seller to select up to 10 listing photos -->
        <label for="photos">Listing Photos (Maximum 10):</label>
        <input type="file"
               id="photos"
               name="uploadedPhotos"
               accept="image/jpeg,image/png,image/webp"
               multiple>

        <p id="photo-count">You can upload up to 10 photos.</p>

        <!-- Displays previews of the selected photos -->
        <div id="photo-preview"
             style="display: flex; flex-wrap: wrap; gap: 10px;">
        </div>

        <br>

        <button type="submit">Publish Listing</button>

    </form>

    <div class="link">
        <p>
            <a href="/listings">Return to listings page</a>
        </p>
    </div>

    <script>
        // Gets the photo input and preview elements.
        const photoInput = document.getElementById("photos");
        const photoPreview = document.getElementById("photo-preview");
        const photoCount = document.getElementById("photo-count");

        // Displays previews and checks the maximum photo count.
        photoInput.addEventListener("change", function () {

            const files = Array.from(this.files);

            // Clears previous previews.
            photoPreview.innerHTML = "";

            // Checks that no more than 10 photos are selected.
            if (files.length > 10) {
                alert("You can select a maximum of 10 photos.");
                this.value = "";
                photoCount.textContent =
                    "You can upload up to 10 photos.";
                return;
            }

            photoCount.textContent =
                files.length + " photo(s) selected.";

            // Creates a preview for each selected image.
            files.forEach(function (file) {

                if (!file.type.startsWith("image/")) {
                    return;
                }

                const image = document.createElement("img");

                image.src = URL.createObjectURL(file);
                image.alt = "Selected listing photo";

                image.style.width = "120px";
                image.style.height = "120px";
                image.style.objectFit = "cover";
                image.style.borderRadius = "8px";

                photoPreview.appendChild(image);
            });
        });
    </script>

</body>
</html>
