spring.application.name=sfu_marketplace

spring.config.import=optional:file:./.env[.properties]

server.tomcat.accesslog.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#environment vars for database stuff go here in .env file
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

#so that it doesn't crash when automatically closing nonexistent sessions
spring.session.jdbc.initialize-schema=always

# Maximum size of one uploaded photo
spring.servlet.multipart.max-file-size=5MB

# Maximum total size of one upload request (10 photos plus overhead)
spring.servlet.multipart.max-request-size=55MB